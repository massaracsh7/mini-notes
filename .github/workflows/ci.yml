name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_notes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace apps/api exec prisma generate

      - name: Test API
        run: npm --workspace apps/api run test

      - name: Test WEB
        run: npm --workspace apps/web run test

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Build WEB
        run: npm --workspace apps/web run build

      - name: Docker build
        run: docker compose build