services:
  db:
    image: postgres:16
    container_name: mini_notes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_notes
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mini_notes_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mini_notes
      JWT_SECRET: super-secret-key
      PORT: 3000
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mini_notes_web
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '80'

volumes:
  postgres_data: