<section class="not-found-page">
  <p-card class="not-found-card">
    <div class="not-found-content">
      <span class="eyebrow">404</span>
      <h1>That page wandered off.</h1>
      <p>
        The address may be outdated, the post may have been removed, or the link might simply be
        broken.
      </p>
      <div class="actions">
        <p-button label="Go to notes" icon="pi pi-home" routerLink="/" />
        <p-button
          label="Admin login"
          icon="pi pi-user"
          severity="secondary"
          variant="outlined"
          routerLink="/login"
        />
      </div>
    </div>
  </p-card>
</section>
