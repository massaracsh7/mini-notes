<div class="shell">
  <header class="topbar">
    <div class="brand" routerLink="/">
      <span class="brand-mark">MN</span>
      <div>
        <strong>Mini Notes</strong>
        <small>PrimeNG publishing UI</small>
      </div>
    </div>

    <nav class="nav-links">
      @for (item of navItems; track item.route) {
        @if (item.route !== '/admin' || isAdmin()) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="nav-actions">
      @if (isAdmin()) {
        <p-button
          label="Logout"
          icon="pi pi-sign-out"
          severity="secondary"
          variant="outlined"
          (onClick)="logout()"
        />
      } @else {
        <p-button label="Admin login" icon="pi pi-user" routerLink="/login" />
      }
    </div>
  </header>

  <main class="main">
    <router-outlet />
  </main>
</div>
